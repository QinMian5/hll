[project]
name = "job-queue-integration"
version = "0.1.0"
description = "Shared job-queue HTTP, token, and webhook-auth helpers."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "job_queue_integration"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "ty>=0.0.27",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "ANN", "TID"]
