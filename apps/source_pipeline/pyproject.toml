[project]
name = "source-pipeline"
version = "0.1.0"
description = "Project-owned source-pipeline orchestrator app."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "job-queue-mcp-client",
    "pyjwt[crypto]>=2.10.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy[asyncio]>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["source_pipeline"]

[dependency-groups]
dev = [
    "pytest-anyio>=0.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]
