[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "click>=8.3.0",
    "dramatiq[redis]>=1.18.0",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "job-queue-mcp-client",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pyjwt[crypto]>=2.10.1",
    "pydantic-settings>=2.13.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "pytest>=9.0.2",
    "redis>=7.4.0",
    "rich>=14.2.0",
    "scikit-learn>=1.8.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["core", "entrypoints", "modules", "shared"]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "pytest-anyio>=0.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]
