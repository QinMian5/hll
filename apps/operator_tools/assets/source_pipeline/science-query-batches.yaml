# abstract: Query batches for selecting science-oriented Wikipedia pages.
# out_of_scope: Source-pipeline runtime orchestration and processed-document state.
batches:
  - name: mathematics-core
    query: mathematics algebra geometry trigonometry probability function equation
    limit: 1000

  - name: physics-core
    query: physics force motion energy wave light electricity magnetism
    limit: 1000

  - name: chemistry-core
    query: chemistry atom molecule reaction acid base equilibrium organic
    limit: 1000

  - name: biology-core
    query: biology cell gene protein evolution ecology enzyme
    limit: 1000

  - name: optics-and-waves
    query: optics refraction reflection diffraction lens mirror sound wave
    limit: 1000

  - name: statistics-and-measurement
    query: statistics mean median mode standard deviation measurement error
    limit: 1000
