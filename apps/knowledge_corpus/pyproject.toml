[project]
name = "knowledge-corpus"
version = "0.1.0"
description = "Local-only knowledge corpus app for isolated source-document persistence."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy[asyncio]>=2.0.48",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["knowledge_corpus"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "ANN", "TID"]

[tool.pytest.ini_options]
addopts = "--strict-markers --maxfail=1"
testpaths = ["tests"]

[tool.ty.src]
include = ["src"]
