# abstract: Pre-commit hooks for fast local quality checks in MVP phase-1.
# out_of_scope: Full CI gate orchestration, backend test execution, and release validation.
repos:
  - repo: local
    hooks:
      - id: web-biome-staged-fix
        name: web-biome-staged-fix
        entry: bash scripts/precommit-biome-staged.sh
        language: system
        files: ^apps/web/
        pass_filenames: false
