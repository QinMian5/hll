# abstract: Pre-commit hooks for fast local quality checks in MVP phase-1.
# out_of_scope: Full CI gate orchestration, backend test execution, and release validation.

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: api-ruff-format
        name: api-ruff-format
        entry: uv run --project apps/api ruff format
        language: system
        pass_filenames: false
        files: ^apps/api/

      - id: api-ruff-check-fix
        name: api-ruff-check-fix
        entry: uv run --project apps/api ruff check --fix
        language: system
        pass_filenames: false
        files: ^apps/api/

      - id: api-ty-check
        name: api-ty-check
        entry: uv run --project apps/api ty check apps/api/src
        language: system
        pass_filenames: false
        files: ^apps/api/

      - id: api-import-linter
        name: api-import-linter
        entry: uv run --project apps/api lint-imports --config apps/api/pyproject.toml
        language: system
        pass_filenames: false
        files: ^apps/api/

      - id: knowledge-corpus-ruff-format
        name: knowledge-corpus-ruff-format
        entry: bash -lc 'cd apps/knowledge_corpus && uv run ruff format src tests alembic'
        language: system
        pass_filenames: false
        files: ^apps/knowledge_corpus/

      - id: knowledge-corpus-ruff-check-fix
        name: knowledge-corpus-ruff-check-fix
        entry: bash -lc 'cd apps/knowledge_corpus && uv run ruff check --fix src tests alembic'
        language: system
        pass_filenames: false
        files: ^apps/knowledge_corpus/

      - id: knowledge-corpus-ty-check
        name: knowledge-corpus-ty-check
        entry: bash -lc 'cd apps/knowledge_corpus && uv run ty check --project . src'
        language: system
        pass_filenames: false
        files: ^apps/knowledge_corpus/

      - id: js-biome-check-write
        name: js-biome-check-write
        entry: pnpm run js:fix
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/contracts/)

      - id: js-tsc-no-emit
        name: js-tsc-no-emit
        entry: pnpm run js:typecheck
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/contracts/)

      - id: commitlint
        name: commitlint
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
