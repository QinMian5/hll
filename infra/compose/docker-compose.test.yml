# abstract: Lightweight isolated PostgreSQL + Redis topology for integration and migration tests.
# out_of_scope: Application container runtime and production ingress networking.
name: knowledge-test

x-postgres-env-file: &postgres-env-file
  - path: ../env/generated/.env.test.postgres.runtime
    required: false
    format: raw

x-knowledge-corpus-db-env-file: &knowledge-corpus-db-env-file
  - path: ../env/generated/.env.test.knowledge-corpus-db.runtime
    required: false
    format: raw

x-source-pipeline-db-env-file: &source-pipeline-db-env-file
  - path: ../env/generated/.env.test.source-pipeline-db.runtime
    required: false
    format: raw

x-mcp-db-env-file: &mcp-db-env-file
  - path: ../env/generated/.env.test.mcp-db.runtime
    required: false
    format: raw

x-knowledge-corpus-migrate-env-file: &knowledge-corpus-migrate-env-file
  - path: ../env/generated/.env.test.knowledge-corpus-migrate.runtime
    required: false
    format: raw

x-source-pipeline-migrate-env-file: &source-pipeline-migrate-env-file
  - path: ../env/generated/.env.test.source-pipeline-migrate.runtime
    required: false
    format: raw

x-mcp-migrate-env-file: &mcp-migrate-env-file
  - path: ../env/generated/.env.test.mcp-migrate.runtime
    required: false
    format: raw

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-postgres:test
    env_file: *postgres-env-file
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    networks:
      - backend
      - edge
    restart: "no"

  knowledge_corpus_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-corpus-postgres:test
    env_file: *knowledge-corpus-db-env-file
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "55433:5432"
    volumes:
      - knowledge_corpus_postgres_test_data:/var/lib/postgresql
    networks:
      - backend
      - edge
    restart: "no"

  source_pipeline_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-source-pipeline-postgres:test
    env_file: *source-pipeline-db-env-file
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "55434:5432"
    volumes:
      - source_pipeline_postgres_test_data:/var/lib/postgresql
    networks:
      - backend
      - edge
    restart: "no"

  mcp_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-mcp-postgres:test
    env_file: *mcp-db-env-file
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "55435:5432"
    volumes:
      - knowledge_mcp_postgres_test_data:/var/lib/postgresql
    networks:
      - backend
      - edge
    restart: "no"

  knowledge_corpus_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/knowledge_corpus/Dockerfile
    image: knowledge-corpus-migrate:test
    env_file: *knowledge-corpus-migrate-env-file
    depends_on:
      knowledge_corpus_db:
        condition: service_healthy
    command: ["alembic", "-c", "/app/apps/knowledge_corpus/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"
    volumes:
      - ../../apps/knowledge_corpus/src:/app/apps/knowledge_corpus/src
      - ../../apps/knowledge_corpus/alembic:/app/apps/knowledge_corpus/alembic
      - ../../apps/knowledge_corpus/alembic.ini:/app/apps/knowledge_corpus/alembic.ini

  source_pipeline_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/source_pipeline/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    image: knowledge-source-pipeline:test
    env_file: *source-pipeline-migrate-env-file
    depends_on:
      source_pipeline_db:
        condition: service_healthy
    command: ["alembic", "-c", "/app/apps/source_pipeline/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"
    volumes:
      - ../../apps/source_pipeline/src:/app/apps/source_pipeline/src
      - ../../apps/source_pipeline/alembic:/app/apps/source_pipeline/alembic
      - ../../apps/source_pipeline/alembic.ini:/app/apps/source_pipeline/alembic.ini

  mcp_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/mcp/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    image: knowledge-mcp:test
    env_file: *mcp-migrate-env-file
    depends_on:
      mcp_db:
        condition: service_healthy
    command: ["alembic", "-c", "/app/apps/mcp/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"
    volumes:
      - ../../apps/mcp/src:/app/apps/mcp/src
      - ../../apps/mcp/alembic:/app/apps/mcp/alembic
      - ../../apps/mcp/alembic.ini:/app/apps/mcp/alembic.ini

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "56379:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - backend
      - edge
    restart: "no"

volumes:
  postgres_test_data:
  knowledge_corpus_postgres_test_data:
  source_pipeline_postgres_test_data:
  knowledge_mcp_postgres_test_data:
  redis_test_data:

networks:
  backend:
    internal: true
  edge:
