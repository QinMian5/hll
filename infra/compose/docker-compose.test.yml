# abstract: Lightweight isolated PostgreSQL + Redis topology for integration and migration tests.
# out_of_scope: Application container runtime and production ingress networking.
name: knowledge-test

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-postgres:test
    environment:
      POSTGRES_DB: ${KNOWLEDGE_API_POSTGRES_DB:?KNOWLEDGE_API_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_API_POSTGRES_USER:?KNOWLEDGE_API_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_API_POSTGRES_PASSWORD:?KNOWLEDGE_API_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${KNOWLEDGE_API_DB_USER:?KNOWLEDGE_API_DB_USER is required}
      APP_DB_PASSWORD: ${KNOWLEDGE_API_DB_PASSWORD:?KNOWLEDGE_API_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${KNOWLEDGE_API_MIGRATION_DB_USER:?KNOWLEDGE_API_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${KNOWLEDGE_API_MIGRATION_DB_PASSWORD:?KNOWLEDGE_API_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    networks:
      - backend
      - edge
    restart: "no"

  knowledge_corpus_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-corpus-postgres:test
    environment:
      POSTGRES_DB: ${KNOWLEDGE_CORPUS_POSTGRES_DB:?KNOWLEDGE_CORPUS_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_CORPUS_POSTGRES_USER:?KNOWLEDGE_CORPUS_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_CORPUS_POSTGRES_PASSWORD:?KNOWLEDGE_CORPUS_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${KNOWLEDGE_CORPUS_APP_DB_USER:?KNOWLEDGE_CORPUS_APP_DB_USER is required}
      APP_DB_PASSWORD: ${KNOWLEDGE_CORPUS_APP_DB_PASSWORD:?KNOWLEDGE_CORPUS_APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${KNOWLEDGE_CORPUS_MIGRATION_DB_USER:?KNOWLEDGE_CORPUS_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD:?KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "55433:5432"
    volumes:
      - knowledge_corpus_postgres_test_data:/var/lib/postgresql
    networks:
      - backend
      - edge
    restart: "no"

  source_pipeline_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-source-pipeline-postgres:test
    environment:
      POSTGRES_DB: ${SOURCE_PIPELINE_POSTGRES_DB:?SOURCE_PIPELINE_POSTGRES_DB is required}
      POSTGRES_USER: ${SOURCE_PIPELINE_POSTGRES_USER:?SOURCE_PIPELINE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${SOURCE_PIPELINE_POSTGRES_PASSWORD:?SOURCE_PIPELINE_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${SOURCE_PIPELINE_APP_DB_USER:?SOURCE_PIPELINE_APP_DB_USER is required}
      APP_DB_PASSWORD: ${SOURCE_PIPELINE_APP_DB_PASSWORD:?SOURCE_PIPELINE_APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${SOURCE_PIPELINE_MIGRATION_DB_USER:?SOURCE_PIPELINE_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${SOURCE_PIPELINE_MIGRATION_DB_PASSWORD:?SOURCE_PIPELINE_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "55434:5432"
    volumes:
      - source_pipeline_postgres_test_data:/var/lib/postgresql
    networks:
      - backend
      - edge
    restart: "no"

  knowledge_corpus_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/knowledge_corpus/Dockerfile
    image: knowledge-corpus-migrate:test
    depends_on:
      knowledge_corpus_db:
        condition: service_healthy
    environment:
      KNOWLEDGE_CORPUS_DATABASE_URL: postgresql+psycopg://${KNOWLEDGE_CORPUS_APP_DB_USER:?KNOWLEDGE_CORPUS_APP_DB_USER is required}:${KNOWLEDGE_CORPUS_APP_DB_PASSWORD:?KNOWLEDGE_CORPUS_APP_DB_PASSWORD is required}@knowledge_corpus_db:5432/${KNOWLEDGE_CORPUS_POSTGRES_DB:?KNOWLEDGE_CORPUS_POSTGRES_DB is required}
      KNOWLEDGE_CORPUS_MIGRATION_DATABASE_URL: postgresql+psycopg://${KNOWLEDGE_CORPUS_MIGRATION_DB_USER:?KNOWLEDGE_CORPUS_MIGRATION_DB_USER is required}:${KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD:?KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD is required}@knowledge_corpus_db:5432/${KNOWLEDGE_CORPUS_POSTGRES_DB:?KNOWLEDGE_CORPUS_POSTGRES_DB is required}
    networks:
      - backend
    restart: "no"
    volumes:
      - ../../apps/knowledge_corpus/src:/app/apps/knowledge_corpus/src
      - ../../apps/knowledge_corpus/alembic:/app/apps/knowledge_corpus/alembic
      - ../../apps/knowledge_corpus/alembic.ini:/app/apps/knowledge_corpus/alembic.ini

  source_pipeline_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/source_pipeline/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    image: knowledge-source-pipeline:test
    depends_on:
      source_pipeline_db:
        condition: service_healthy
    environment:
      SOURCE_PIPELINE_MIGRATION_DATABASE_URL: postgresql+psycopg://${SOURCE_PIPELINE_MIGRATION_DB_USER:?SOURCE_PIPELINE_MIGRATION_DB_USER is required}:${SOURCE_PIPELINE_MIGRATION_DB_PASSWORD:?SOURCE_PIPELINE_MIGRATION_DB_PASSWORD is required}@source_pipeline_db:5432/${SOURCE_PIPELINE_POSTGRES_DB:?SOURCE_PIPELINE_POSTGRES_DB is required}
    networks:
      - backend
    restart: "no"
    volumes:
      - ../../apps/source_pipeline/src:/app/apps/source_pipeline/src
      - ../../apps/source_pipeline/alembic:/app/apps/source_pipeline/alembic
      - ../../apps/source_pipeline/alembic.ini:/app/apps/source_pipeline/alembic.ini

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - backend
      - edge
    restart: "no"

volumes:
  postgres_test_data:
  knowledge_corpus_postgres_test_data:
  source_pipeline_postgres_test_data:
  redis_test_data:

networks:
  backend:
    internal: true
  edge:
