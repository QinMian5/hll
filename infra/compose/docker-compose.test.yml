# abstract: Lightweight isolated PostgreSQL + Redis topology for integration and migration tests.
# out_of_scope: Application container runtime and production ingress networking.
services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    networks:
      - backend
    restart: "no"

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    networks:
      - backend
    restart: "no"

volumes:
  postgres_test_data:

networks:
  backend:
    internal: true
