# abstract: Development overrides for the Docker Compose base topology.
# out_of_scope: Production runtime hardening and host-level security controls.
name: knowledge-dev

x-postgres-env-file: &postgres-env-file
  - path: ../env/generated/.env.dev.postgres.runtime
    required: false
    format: raw

x-logto-postgres-env-file: &logto-postgres-env-file
  - path: ../env/generated/.env.dev.logto-postgres.runtime
    required: false
    format: raw

x-knowledge-corpus-db-env-file: &knowledge-corpus-db-env-file
  - path: ../env/generated/.env.dev.knowledge-corpus-db.runtime
    required: false
    format: raw

x-source-pipeline-db-env-file: &source-pipeline-db-env-file
  - path: ../env/generated/.env.dev.source-pipeline-db.runtime
    required: false
    format: raw

x-mcp-db-env-file: &mcp-db-env-file
  - path: ../env/generated/.env.dev.mcp-db.runtime
    required: false
    format: raw

x-logto-env-file: &logto-env-file
  - path: ../env/generated/.env.dev.logto.runtime
    required: false
    format: raw

x-api-migrate-env-file: &api-migrate-env-file
  - path: ../env/generated/.env.dev.api-migrate.runtime
    required: false
    format: raw

x-knowledge-corpus-migrate-env-file: &knowledge-corpus-migrate-env-file
  - path: ../env/generated/.env.dev.knowledge-corpus-migrate.runtime
    required: false
    format: raw

x-source-pipeline-migrate-env-file: &source-pipeline-migrate-env-file
  - path: ../env/generated/.env.dev.source-pipeline-migrate.runtime
    required: false
    format: raw

x-mcp-migrate-env-file: &mcp-migrate-env-file
  - path: ../env/generated/.env.dev.mcp-migrate.runtime
    required: false
    format: raw

x-api-worker-env-file: &api-worker-env-file
  - path: ../env/generated/.env.dev.api-worker.runtime
    required: false
    format: raw

x-mcp-env-file: &mcp-env-file
  - path: ../env/generated/.env.dev.mcp.runtime
    required: false
    format: raw

x-taxonomy-view-layout-env-file: &taxonomy-view-layout-env-file
  - path: ../env/generated/.env.dev.taxonomy-view-layout.runtime
    required: false
    format: raw

x-taxonomy-classification-env-file: &taxonomy-classification-env-file
  - path: ../env/generated/.env.dev.taxonomy-classification.runtime
    required: false
    format: raw

x-taxonomy-classification-webhook-env-file: &taxonomy-classification-webhook-env-file
  - path: ../env/generated/.env.dev.taxonomy-classification-webhook.runtime
    required: false
    format: raw

x-source-pipeline-orchestrator-env-file: &source-pipeline-orchestrator-env-file
  - path: ../env/generated/.env.dev.source-pipeline-orchestrator.runtime
    required: false
    format: raw

x-source-pipeline-webhook-env-file: &source-pipeline-webhook-env-file
  - path: ../env/generated/.env.dev.source-pipeline-webhook.runtime
    required: false
    format: raw

x-web-env-file: &web-env-file
  - path: ../env/generated/.env.dev.web.runtime
    required: false
    format: raw

services:
  postgres:
    image: knowledge-postgres:dev
    env_file: *postgres-env-file
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 192
    networks:
      - backend
      - edge
    ports:
      - "5432:5432"

  logto-postgres:
    image: postgres:18.3-bookworm
    env_file: *logto-postgres-env-file
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128

  logto-seed:
    env_file: *logto-env-file
    extra_hosts:
      - "knowledge-dev-logto.localhost:host-gateway"
      - "knowledge-dev-logto-admin.localhost:host-gateway"

  logto:
    env_file: *logto-env-file
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    extra_hosts:
      - "knowledge-dev-logto.localhost:host-gateway"
      - "knowledge-dev-logto-admin.localhost:host-gateway"
    ports:
      - "3011:3001"
      - "3012:3002"

  knowledge_corpus_db:
    image: knowledge-corpus-postgres:dev
    env_file: *knowledge-corpus-db-env-file
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 192
    command:
      - postgres
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
    networks:
      - backend
      - edge
    ports:
      - "5433:5432"

  source_pipeline_db:
    image: knowledge-source-pipeline-postgres:dev
    env_file: *source-pipeline-db-env-file
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128

  mcp_db:
    image: knowledge-mcp-postgres:dev
    env_file: *mcp-db-env-file
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128

  redis:
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.25
    pids_limit: 96

  migrate:
    image: knowledge-api:dev
    env_file: *api-migrate-env-file
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini

  knowledge_corpus_migrate:
    image: knowledge-corpus-migrate:dev
    env_file: *knowledge-corpus-migrate-env-file
    volumes:
      - ../../apps/knowledge_corpus/src:/app/apps/knowledge_corpus/src
      - ../../apps/knowledge_corpus/alembic:/app/apps/knowledge_corpus/alembic
      - ../../apps/knowledge_corpus/alembic.ini:/app/apps/knowledge_corpus/alembic.ini

  source_pipeline_migrate:
    image: knowledge-source-pipeline:dev
    env_file: *source-pipeline-migrate-env-file
    volumes:
      - ../../apps/source_pipeline/src:/app/apps/source_pipeline/src
      - ../../apps/source_pipeline/alembic:/app/apps/source_pipeline/alembic
      - ../../apps/source_pipeline/alembic.ini:/app/apps/source_pipeline/alembic.ini

  mcp_migrate:
    image: knowledge-mcp:dev
    env_file: *mcp-migrate-env-file
    volumes:
      - ../../apps/mcp/src:/app/apps/mcp/src
      - ../../apps/mcp/alembic:/app/apps/mcp/alembic
      - ../../apps/mcp/alembic.ini:/app/apps/mcp/alembic.ini

  api:
    image: knowledge-api:dev
    env_file: *api-worker-env-file
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 192
    environment:
      API_RELOAD: "1"
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini
    ports:
      - "8001:8000"

  mcp:
    image: knowledge-mcp:dev
    env_file: *mcp-env-file
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    environment:
      MCP_RELOAD: "1"
    volumes:
      - ../../apps/mcp/src:/app/apps/mcp/src
      - ../../apps/mcp/alembic:/app/apps/mcp/alembic
      - ../../apps/mcp/alembic.ini:/app/apps/mcp/alembic.ini
      - ../../apps/mcp/tests:/app/apps/mcp/tests
      - ../../packages/contracts/generated/python/src:/app/packages/contracts/generated/python/src
    ports:
      - "8002:8080"

  worker:
    image: knowledge-api:dev
    env_file: *api-worker-env-file
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.0
    pids_limit: 384

  taxonomy_view_layout_runtime:
    image: knowledge-api:dev
    env_file: *taxonomy-view-layout-env-file
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini

  taxonomy_classification_runtime:
    image: knowledge-api:dev
    env_file: *taxonomy-classification-env-file
    profiles: ["taxonomy_classification_runtime"]
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini

  taxonomy_classification_webhook_receiver:
    image: knowledge-api:dev
    env_file: *taxonomy-classification-webhook-env-file
    profiles: ["taxonomy_classification_webhook_receiver"]
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini

  orchestrator:
    image: knowledge-source-pipeline:dev
    env_file: *source-pipeline-orchestrator-env-file
    profiles: ["orchestrator"]

  source_pipeline_webhook_receiver:
    image: knowledge-source-pipeline:dev
    env_file: *source-pipeline-webhook-env-file
    profiles: ["webhook_receiver"]
    volumes:
      - ../../apps/source_pipeline/src:/app/apps/source_pipeline/src
      - ../../apps/source_pipeline/alembic:/app/apps/source_pipeline/alembic
      - ../../apps/source_pipeline/alembic.ini:/app/apps/source_pipeline/alembic.ini

  web:
    build:
      target: dev
    image: knowledge-web:dev
    env_file: *web-env-file
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 0.5
    pids_limit: 128
    environment:
      NODE_ENV: development
    volumes:
      - ../../apps/web:/workspace/apps/web
      - ../../packages/contracts:/workspace/packages/contracts
    ports:
      - "5174:5173"
