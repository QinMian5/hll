# abstract: Development overrides for the Docker Compose base topology.
# out_of_scope: Production runtime hardening and host-level security controls.
services:
  postgres:
    networks:
      - backend
      - edge
    ports:
      - "5432:5432"

  migrate:
    env_file:
      - ../../infra/env/.env.dev
    volumes:
      - ../../apps/api/src:/app/src
      - ../../apps/api/alembic:/app/alembic
      - ../../apps/api/alembic.ini:/app/alembic.ini

  api:
    env_file:
      - ../../infra/env/.env.dev
    environment:
      API_RELOAD: "1"
    volumes:
      - ../../apps/api/src:/app/src
      - ../../apps/api/alembic:/app/alembic
      - ../../apps/api/alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"

  worker:
    env_file:
      - ../../infra/env/.env.dev

  web:
    build:
      target: dev
    volumes:
      - ../../apps/web:/workspace/apps/web
      - ../../packages/contracts:/workspace/packages/contracts
    ports:
      - "5173:5173"

volumes:
  knowledge_postgres_data:
    name: knowledge_postgres_dev_data
