# abstract: Development overrides for the Docker Compose base topology.
# out_of_scope: Production runtime hardening and host-level security controls.
name: knowledge-dev

services:
  postgres:
    image: knowledge-postgres:dev
    networks:
      - backend
      - edge
    ports:
      - "5432:5432"

  logto-postgres:
    image: postgres:18.3-bookworm

  logto:
    ports:
      - "3011:3001"
      - "3012:3002"

  knowledge_corpus_db:
    image: knowledge-corpus-postgres:dev
    command:
      - postgres
      - -c
      - max_wal_size=${KNOWLEDGE_CORPUS_DB_MAX_WAL_SIZE:?KNOWLEDGE_CORPUS_DB_MAX_WAL_SIZE is required}
      - -c
      - checkpoint_timeout=${KNOWLEDGE_CORPUS_DB_CHECKPOINT_TIMEOUT:?KNOWLEDGE_CORPUS_DB_CHECKPOINT_TIMEOUT is required}
      - -c
      - checkpoint_completion_target=${KNOWLEDGE_CORPUS_DB_CHECKPOINT_COMPLETION_TARGET:?KNOWLEDGE_CORPUS_DB_CHECKPOINT_COMPLETION_TARGET is required}
    networks:
      - backend
      - edge
    ports:
      - "5433:5432"

  source_pipeline_db:
    image: knowledge-source-pipeline-postgres:dev

  mcp_db:
    image: knowledge-mcp-postgres:dev

  migrate:
    image: knowledge-api:dev
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini

  knowledge_corpus_migrate:
    image: knowledge-corpus-migrate:dev
    volumes:
      - ../../apps/knowledge_corpus/src:/app/apps/knowledge_corpus/src
      - ../../apps/knowledge_corpus/alembic:/app/apps/knowledge_corpus/alembic
      - ../../apps/knowledge_corpus/alembic.ini:/app/apps/knowledge_corpus/alembic.ini

  source_pipeline_migrate:
    image: knowledge-source-pipeline:dev
    volumes:
      - ../../apps/source_pipeline/src:/app/apps/source_pipeline/src
      - ../../apps/source_pipeline/alembic:/app/apps/source_pipeline/alembic
      - ../../apps/source_pipeline/alembic.ini:/app/apps/source_pipeline/alembic.ini

  mcp_migrate:
    image: knowledge-mcp:dev
    volumes:
      - ../../apps/mcp/src:/app/apps/mcp/src
      - ../../apps/mcp/alembic:/app/apps/mcp/alembic
      - ../../apps/mcp/alembic.ini:/app/apps/mcp/alembic.ini

  api:
    image: knowledge-api:dev
    environment:
      API_RELOAD: "1"
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini
    ports:
      - "8001:8000"

  mcp:
    image: knowledge-mcp:dev
    environment:
      MCP_RELOAD: "1"
    volumes:
      - ../../apps/mcp/src:/app/apps/mcp/src
      - ../../apps/mcp/alembic:/app/apps/mcp/alembic
      - ../../apps/mcp/alembic.ini:/app/apps/mcp/alembic.ini
      - ../../apps/mcp/tests:/app/apps/mcp/tests
      - ../../packages/contracts/generated/python/src:/app/packages/contracts/generated/python/src
    ports:
      - "8002:8080"

  worker:
    image: knowledge-api:dev

  taxonomy_classification_runtime:
    image: knowledge-api:dev
    profiles: ["taxonomy_classification_runtime"]
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini

  taxonomy_classification_webhook_receiver:
    image: knowledge-api:dev
    profiles: ["taxonomy_classification_webhook_receiver"]
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/alembic:/app/apps/api/alembic
      - ../../apps/api/alembic.ini:/app/apps/api/alembic.ini

  orchestrator:
    image: knowledge-source-pipeline:dev
    profiles: ["orchestrator"]

  source_pipeline_webhook_receiver:
    image: knowledge-source-pipeline:dev
    profiles: ["webhook_receiver"]
    volumes:
      - ../../apps/source_pipeline/src:/app/apps/source_pipeline/src
      - ../../apps/source_pipeline/alembic:/app/apps/source_pipeline/alembic
      - ../../apps/source_pipeline/alembic.ini:/app/apps/source_pipeline/alembic.ini

  web:
    build:
      target: dev
    image: knowledge-web:dev
    volumes:
      - ../../apps/web:/workspace/apps/web
      - ../../packages/contracts:/workspace/packages/contracts
    ports:
      - "5174:5173"
