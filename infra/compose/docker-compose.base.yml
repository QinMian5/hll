# abstract: Base Docker Compose topology for MVP deployment with explicit migration gating.
# out_of_scope: Environment-specific overrides and host port exposure policies.
name: knowledge

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_redis_data:/data
    networks:
      - backend
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    image: knowledge-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    image: knowledge-api:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
    command: ["/app/bin/run-api.sh"]
    expose:
      - "8000"
    networks:
      - backend
      - edge
    restart: unless-stopped

  worker:
    image: knowledge-api:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
    command: ["/app/bin/run-worker.sh"]
    networks:
      - backend
      - edge
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      target: prod
    image: knowledge-web:local
    depends_on:
      api:
        condition: service_started
    expose:
      - "4173"
    networks:
      - edge
    restart: unless-stopped

volumes:
  knowledge_postgres_data:
    name: knowledge_postgres_data
  knowledge_redis_data:
    name: knowledge_redis_data

networks:
  backend:
    name: knowledge_backend
    internal: true
  edge:
    name: knowledge_edge
