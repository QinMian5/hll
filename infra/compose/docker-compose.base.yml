# abstract: Base Docker Compose topology for MVP deployment with explicit migration gating.
# out_of_scope: Environment-specific overrides and host port exposure policies.

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${KNOWLEDGE_API_POSTGRES_DB:?KNOWLEDGE_API_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_API_POSTGRES_USER:?KNOWLEDGE_API_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_API_POSTGRES_PASSWORD:?KNOWLEDGE_API_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${KNOWLEDGE_API_DB_USER:?KNOWLEDGE_API_DB_USER is required}
      APP_DB_PASSWORD: ${KNOWLEDGE_API_DB_PASSWORD:?KNOWLEDGE_API_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${KNOWLEDGE_API_MIGRATION_DB_USER:?KNOWLEDGE_API_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${KNOWLEDGE_API_MIGRATION_DB_PASSWORD:?KNOWLEDGE_API_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  logto-postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: ${KNOWLEDGE_LOGTO_POSTGRES_DB:?KNOWLEDGE_LOGTO_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_LOGTO_POSTGRES_USER:?KNOWLEDGE_LOGTO_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_LOGTO_POSTGRES_PASSWORD:?KNOWLEDGE_LOGTO_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_logto_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  knowledge_corpus_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${KNOWLEDGE_CORPUS_POSTGRES_DB:?KNOWLEDGE_CORPUS_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_CORPUS_POSTGRES_USER:?KNOWLEDGE_CORPUS_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_CORPUS_POSTGRES_PASSWORD:?KNOWLEDGE_CORPUS_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${KNOWLEDGE_CORPUS_APP_DB_USER:?KNOWLEDGE_CORPUS_APP_DB_USER is required}
      APP_DB_PASSWORD: ${KNOWLEDGE_CORPUS_APP_DB_PASSWORD:?KNOWLEDGE_CORPUS_APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${KNOWLEDGE_CORPUS_MIGRATION_DB_USER:?KNOWLEDGE_CORPUS_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD:?KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_corpus_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  source_pipeline_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${SOURCE_PIPELINE_POSTGRES_DB:?SOURCE_PIPELINE_POSTGRES_DB is required}
      POSTGRES_USER: ${SOURCE_PIPELINE_POSTGRES_USER:?SOURCE_PIPELINE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${SOURCE_PIPELINE_POSTGRES_PASSWORD:?SOURCE_PIPELINE_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${SOURCE_PIPELINE_APP_DB_USER:?SOURCE_PIPELINE_APP_DB_USER is required}
      APP_DB_PASSWORD: ${SOURCE_PIPELINE_APP_DB_PASSWORD:?SOURCE_PIPELINE_APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${SOURCE_PIPELINE_MIGRATION_DB_USER:?SOURCE_PIPELINE_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${SOURCE_PIPELINE_MIGRATION_DB_PASSWORD:?SOURCE_PIPELINE_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - source_pipeline_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  mcp_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${KNOWLEDGE_MCP_POSTGRES_DB:?KNOWLEDGE_MCP_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_MCP_POSTGRES_USER:?KNOWLEDGE_MCP_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_MCP_POSTGRES_PASSWORD:?KNOWLEDGE_MCP_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${KNOWLEDGE_MCP_DB_USER:?KNOWLEDGE_MCP_DB_USER is required}
      APP_DB_PASSWORD: ${KNOWLEDGE_MCP_DB_PASSWORD:?KNOWLEDGE_MCP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${KNOWLEDGE_MCP_MIGRATION_DB_USER:?KNOWLEDGE_MCP_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${KNOWLEDGE_MCP_MIGRATION_DB_PASSWORD:?KNOWLEDGE_MCP_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_mcp_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_redis_data:/data
    networks:
      - backend
    restart: unless-stopped

  logto-seed:
    image: svhd/logto:${KNOWLEDGE_LOGTO_TAG:?KNOWLEDGE_LOGTO_TAG is required}
    depends_on:
      logto-postgres:
        condition: service_healthy
    environment:
      DB_URL: postgres://${KNOWLEDGE_LOGTO_POSTGRES_USER:?KNOWLEDGE_LOGTO_POSTGRES_USER is required}:${KNOWLEDGE_LOGTO_POSTGRES_PASSWORD:?KNOWLEDGE_LOGTO_POSTGRES_PASSWORD is required}@logto-postgres:5432/${KNOWLEDGE_LOGTO_POSTGRES_DB:?KNOWLEDGE_LOGTO_POSTGRES_DB is required}
      ENDPOINT: ${KNOWLEDGE_LOGTO_ENDPOINT:?KNOWLEDGE_LOGTO_ENDPOINT is required}
      ADMIN_ENDPOINT: ${KNOWLEDGE_LOGTO_ADMIN_ENDPOINT:?KNOWLEDGE_LOGTO_ADMIN_ENDPOINT is required}
      ADMIN_PORT: "3002"
      TRUST_PROXY_HEADER: ${KNOWLEDGE_LOGTO_TRUST_PROXY_HEADER:?KNOWLEDGE_LOGTO_TRUST_PROXY_HEADER is required}
      DATABASE_STATEMENT_TIMEOUT: ${KNOWLEDGE_LOGTO_DATABASE_STATEMENT_TIMEOUT?KNOWLEDGE_LOGTO_DATABASE_STATEMENT_TIMEOUT is required}
    entrypoint:
      [
        "sh",
        "-lc",
        "npm run cli db seed -- --db-url \"$$DB_URL\" --swe",
      ]
    networks:
      - backend
    restart: "no"

  logto:
    image: svhd/logto:${KNOWLEDGE_LOGTO_TAG:?KNOWLEDGE_LOGTO_TAG is required}
    depends_on:
      logto-postgres:
        condition: service_healthy
      logto-seed:
        condition: service_completed_successfully
    environment:
      DB_URL: postgres://${KNOWLEDGE_LOGTO_POSTGRES_USER:?KNOWLEDGE_LOGTO_POSTGRES_USER is required}:${KNOWLEDGE_LOGTO_POSTGRES_PASSWORD:?KNOWLEDGE_LOGTO_POSTGRES_PASSWORD is required}@logto-postgres:5432/${KNOWLEDGE_LOGTO_POSTGRES_DB:?KNOWLEDGE_LOGTO_POSTGRES_DB is required}
      ENDPOINT: ${KNOWLEDGE_LOGTO_ENDPOINT:?KNOWLEDGE_LOGTO_ENDPOINT is required}
      ADMIN_ENDPOINT: ${KNOWLEDGE_LOGTO_ADMIN_ENDPOINT:?KNOWLEDGE_LOGTO_ADMIN_ENDPOINT is required}
      ADMIN_PORT: "3002"
      TRUST_PROXY_HEADER: ${KNOWLEDGE_LOGTO_TRUST_PROXY_HEADER:?KNOWLEDGE_LOGTO_TRUST_PROXY_HEADER is required}
      DATABASE_STATEMENT_TIMEOUT: ${KNOWLEDGE_LOGTO_DATABASE_STATEMENT_TIMEOUT?KNOWLEDGE_LOGTO_DATABASE_STATEMENT_TIMEOUT is required}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/oidc/.well-known/openid-configuration', (response) => process.exit(response.statusCode && response.statusCode >= 200 && response.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend
      - edge
    restart: unless-stopped

  migrate:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KNOWLEDGE_API_MIGRATION_DATABASE_URL: ${KNOWLEDGE_API_MIGRATION_DATABASE_URL:?KNOWLEDGE_API_MIGRATION_DATABASE_URL is required}
    command: ["alembic", "-c", "/app/apps/api/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  knowledge_corpus_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/knowledge_corpus/Dockerfile
    depends_on:
      knowledge_corpus_db:
        condition: service_healthy
    environment:
      KNOWLEDGE_CORPUS_DATABASE_URL: ${KNOWLEDGE_CORPUS_DATABASE_URL:?KNOWLEDGE_CORPUS_DATABASE_URL is required}
      KNOWLEDGE_CORPUS_MIGRATION_DATABASE_URL: ${KNOWLEDGE_CORPUS_MIGRATION_DATABASE_URL:?KNOWLEDGE_CORPUS_MIGRATION_DATABASE_URL is required}
    command: ["alembic", "-c", "/app/apps/knowledge_corpus/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  source_pipeline_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/source_pipeline/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      source_pipeline_db:
        condition: service_healthy
    environment:
      SOURCE_PIPELINE_MIGRATION_DATABASE_URL: ${SOURCE_PIPELINE_MIGRATION_DATABASE_URL:?SOURCE_PIPELINE_MIGRATION_DATABASE_URL is required}
    command: ["alembic", "-c", "/app/apps/source_pipeline/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  mcp_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/mcp/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      mcp_db:
        condition: service_healthy
    environment:
      KNOWLEDGE_MCP_DATABASE_URL: ${KNOWLEDGE_MCP_DATABASE_URL:?KNOWLEDGE_MCP_DATABASE_URL is required}
      KNOWLEDGE_MCP_MIGRATION_DATABASE_URL: ${KNOWLEDGE_MCP_MIGRATION_DATABASE_URL:?KNOWLEDGE_MCP_MIGRATION_DATABASE_URL is required}
    command: ["alembic", "-c", "/app/apps/mcp/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      KNOWLEDGE_API_DATABASE_URL: ${KNOWLEDGE_API_DATABASE_URL:?KNOWLEDGE_API_DATABASE_URL is required}
      KNOWLEDGE_API_REDIS_URL: ${KNOWLEDGE_API_REDIS_URL:?KNOWLEDGE_API_REDIS_URL is required}
      KNOWLEDGE_API_EMBEDDING_API_URL: ${KNOWLEDGE_API_EMBEDDING_API_URL:?KNOWLEDGE_API_EMBEDDING_API_URL is required}
      KNOWLEDGE_API_EMBEDDING_MODEL: ${KNOWLEDGE_API_EMBEDDING_MODEL:?KNOWLEDGE_API_EMBEDDING_MODEL is required}
      KNOWLEDGE_API_EMBEDDING_API_KEY: ${KNOWLEDGE_API_EMBEDDING_API_KEY:?KNOWLEDGE_API_EMBEDDING_API_KEY is required}
      KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS:?KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS is required}
      KNOWLEDGE_API_SEARCH_MAX_MATCHED: ${KNOWLEDGE_API_SEARCH_MAX_MATCHED:?KNOWLEDGE_API_SEARCH_MAX_MATCHED is required}
      KNOWLEDGE_API_SEARCH_MAX_CONNECTED: ${KNOWLEDGE_API_SEARCH_MAX_CONNECTED:?KNOWLEDGE_API_SEARCH_MAX_CONNECTED is required}
      KNOWLEDGE_API_EDGE_TITLE_MENTION_TOP_K: ${KNOWLEDGE_API_EDGE_TITLE_MENTION_TOP_K:?KNOWLEDGE_API_EDGE_TITLE_MENTION_TOP_K is required}
      KNOWLEDGE_API_EDGE_SEMANTIC_TOP_K: ${KNOWLEDGE_API_EDGE_SEMANTIC_TOP_K:?KNOWLEDGE_API_EDGE_SEMANTIC_TOP_K is required}
      KNOWLEDGE_API_EDGE_SEMANTIC_MIN_STRENGTH: ${KNOWLEDGE_API_EDGE_SEMANTIC_MIN_STRENGTH:?KNOWLEDGE_API_EDGE_SEMANTIC_MIN_STRENGTH is required}
      KNOWLEDGE_API_EDGE_SEMANTIC_CANDIDATE_LIMIT: ${KNOWLEDGE_API_EDGE_SEMANTIC_CANDIDATE_LIMIT:?KNOWLEDGE_API_EDGE_SEMANTIC_CANDIDATE_LIMIT is required}
      KNOWLEDGE_API_LOG_LEVEL: ${KNOWLEDGE_API_LOG_LEVEL:?KNOWLEDGE_API_LOG_LEVEL is required}
      KNOWLEDGE_API_LOG_FILE_PATH: ${KNOWLEDGE_API_LOG_FILE_PATH:?KNOWLEDGE_API_LOG_FILE_PATH is required}
      KNOWLEDGE_API_LOG_FILE_MAX_BYTES: ${KNOWLEDGE_API_LOG_FILE_MAX_BYTES:?KNOWLEDGE_API_LOG_FILE_MAX_BYTES is required}
      KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT: ${KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT:?KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT is required}
    command: ["/app/bin/run-api.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - backend
      - egress
    restart: unless-stopped

  mcp:
    build:
      context: ../..
      dockerfile: infra/docker/mcp/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      mcp_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      logto:
        condition: service_healthy
    environment:
      KNOWLEDGE_MCP_PUBLIC_BASE_URL: ${KNOWLEDGE_MCP_PUBLIC_BASE_URL:?KNOWLEDGE_MCP_PUBLIC_BASE_URL is required}
      KNOWLEDGE_MCP_INTERNAL_API_BASE_URL: ${KNOWLEDGE_MCP_INTERNAL_API_BASE_URL:?KNOWLEDGE_MCP_INTERNAL_API_BASE_URL is required}
      KNOWLEDGE_MCP_REDIS_URL: ${KNOWLEDGE_MCP_REDIS_URL:?KNOWLEDGE_MCP_REDIS_URL is required}
      KNOWLEDGE_MCP_DATABASE_URL: ${KNOWLEDGE_MCP_DATABASE_URL:?KNOWLEDGE_MCP_DATABASE_URL is required}
      KNOWLEDGE_MCP_LOGTO_ISSUER: ${KNOWLEDGE_MCP_LOGTO_ISSUER:?KNOWLEDGE_MCP_LOGTO_ISSUER is required}
      KNOWLEDGE_MCP_LOGTO_DISCOVERY_URL: ${KNOWLEDGE_MCP_LOGTO_DISCOVERY_URL:?KNOWLEDGE_MCP_LOGTO_DISCOVERY_URL is required}
      KNOWLEDGE_MCP_LOGTO_TOKEN_URL: ${KNOWLEDGE_MCP_LOGTO_TOKEN_URL:?KNOWLEDGE_MCP_LOGTO_TOKEN_URL is required}
      KNOWLEDGE_MCP_LOGTO_RESOURCE: ${KNOWLEDGE_MCP_LOGTO_RESOURCE:?KNOWLEDGE_MCP_LOGTO_RESOURCE is required}
      KNOWLEDGE_MCP_LOGTO_REQUIRED_SCOPES: ${KNOWLEDGE_MCP_LOGTO_REQUIRED_SCOPES:?KNOWLEDGE_MCP_LOGTO_REQUIRED_SCOPES is required}
      KNOWLEDGE_MCP_LOGTO_TOKEN_EXCHANGE_CLIENT_ID: ${KNOWLEDGE_MCP_LOGTO_TOKEN_EXCHANGE_CLIENT_ID:?KNOWLEDGE_MCP_LOGTO_TOKEN_EXCHANGE_CLIENT_ID is required}
      KNOWLEDGE_MCP_LOGTO_TOKEN_EXCHANGE_CLIENT_SECRET: ${KNOWLEDGE_MCP_LOGTO_TOKEN_EXCHANGE_CLIENT_SECRET:?KNOWLEDGE_MCP_LOGTO_TOKEN_EXCHANGE_CLIENT_SECRET is required}
      KNOWLEDGE_MCP_PAT_FINGERPRINT_SECRET: ${KNOWLEDGE_MCP_PAT_FINGERPRINT_SECRET:?KNOWLEDGE_MCP_PAT_FINGERPRINT_SECRET is required}
      KNOWLEDGE_MCP_USAGE_SUMMARY_AUTH_RESOURCE: ${KNOWLEDGE_MCP_USAGE_SUMMARY_AUTH_RESOURCE:?KNOWLEDGE_MCP_USAGE_SUMMARY_AUTH_RESOURCE is required}
      KNOWLEDGE_MCP_USAGE_SUMMARY_REQUIRED_SCOPE: ${KNOWLEDGE_MCP_USAGE_SUMMARY_REQUIRED_SCOPE:?KNOWLEDGE_MCP_USAGE_SUMMARY_REQUIRED_SCOPE is required}
      KNOWLEDGE_MCP_USAGE_SUMMARY_ALLOWED_CLIENT_ID: ${KNOWLEDGE_MCP_USAGE_SUMMARY_ALLOWED_CLIENT_ID:?KNOWLEDGE_MCP_USAGE_SUMMARY_ALLOWED_CLIENT_ID is required}
      KNOWLEDGE_MCP_USAGE_SUMMARY_MAX_BATCH_SIZE: ${KNOWLEDGE_MCP_USAGE_SUMMARY_MAX_BATCH_SIZE:?KNOWLEDGE_MCP_USAGE_SUMMARY_MAX_BATCH_SIZE is required}
      KNOWLEDGE_MCP_ALLOWED_ORIGINS: ${KNOWLEDGE_MCP_ALLOWED_ORIGINS:?KNOWLEDGE_MCP_ALLOWED_ORIGINS is required}
      KNOWLEDGE_MCP_TOKEN_CACHE_TTL_SECONDS: ${KNOWLEDGE_MCP_TOKEN_CACHE_TTL_SECONDS:?KNOWLEDGE_MCP_TOKEN_CACHE_TTL_SECONDS is required}
      KNOWLEDGE_MCP_AUTH_HTTP_TIMEOUT_SECONDS: ${KNOWLEDGE_MCP_AUTH_HTTP_TIMEOUT_SECONDS:?KNOWLEDGE_MCP_AUTH_HTTP_TIMEOUT_SECONDS is required}
      KNOWLEDGE_MCP_QUOTA_REDIS_PREFIX: ${KNOWLEDGE_MCP_QUOTA_REDIS_PREFIX:?KNOWLEDGE_MCP_QUOTA_REDIS_PREFIX is required}
      KNOWLEDGE_MCP_USER_DAILY_LIMIT: ${KNOWLEDGE_MCP_USER_DAILY_LIMIT:?KNOWLEDGE_MCP_USER_DAILY_LIMIT is required}
      KNOWLEDGE_MCP_USER_DAILY_WINDOW_SECONDS: ${KNOWLEDGE_MCP_USER_DAILY_WINDOW_SECONDS:?KNOWLEDGE_MCP_USER_DAILY_WINDOW_SECONDS is required}
      KNOWLEDGE_MCP_USER_WEEKLY_LIMIT: ${KNOWLEDGE_MCP_USER_WEEKLY_LIMIT:?KNOWLEDGE_MCP_USER_WEEKLY_LIMIT is required}
      KNOWLEDGE_MCP_USER_WEEKLY_WINDOW_SECONDS: ${KNOWLEDGE_MCP_USER_WEEKLY_WINDOW_SECONDS:?KNOWLEDGE_MCP_USER_WEEKLY_WINDOW_SECONDS is required}
    command: ["/app/bin/run-mcp.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - backend
      - edge
    restart: unless-stopped

  worker:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      KNOWLEDGE_API_DATABASE_URL: ${KNOWLEDGE_API_DATABASE_URL:?KNOWLEDGE_API_DATABASE_URL is required}
      KNOWLEDGE_API_REDIS_URL: ${KNOWLEDGE_API_REDIS_URL:?KNOWLEDGE_API_REDIS_URL is required}
      KNOWLEDGE_API_EMBEDDING_API_URL: ${KNOWLEDGE_API_EMBEDDING_API_URL:?KNOWLEDGE_API_EMBEDDING_API_URL is required}
      KNOWLEDGE_API_EMBEDDING_MODEL: ${KNOWLEDGE_API_EMBEDDING_MODEL:?KNOWLEDGE_API_EMBEDDING_MODEL is required}
      KNOWLEDGE_API_EMBEDDING_API_KEY: ${KNOWLEDGE_API_EMBEDDING_API_KEY:?KNOWLEDGE_API_EMBEDDING_API_KEY is required}
      KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS:?KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS is required}
      KNOWLEDGE_API_SEARCH_MAX_MATCHED: ${KNOWLEDGE_API_SEARCH_MAX_MATCHED:?KNOWLEDGE_API_SEARCH_MAX_MATCHED is required}
      KNOWLEDGE_API_SEARCH_MAX_CONNECTED: ${KNOWLEDGE_API_SEARCH_MAX_CONNECTED:?KNOWLEDGE_API_SEARCH_MAX_CONNECTED is required}
      KNOWLEDGE_API_EDGE_TITLE_MENTION_TOP_K: ${KNOWLEDGE_API_EDGE_TITLE_MENTION_TOP_K:?KNOWLEDGE_API_EDGE_TITLE_MENTION_TOP_K is required}
      KNOWLEDGE_API_EDGE_SEMANTIC_TOP_K: ${KNOWLEDGE_API_EDGE_SEMANTIC_TOP_K:?KNOWLEDGE_API_EDGE_SEMANTIC_TOP_K is required}
      KNOWLEDGE_API_EDGE_SEMANTIC_MIN_STRENGTH: ${KNOWLEDGE_API_EDGE_SEMANTIC_MIN_STRENGTH:?KNOWLEDGE_API_EDGE_SEMANTIC_MIN_STRENGTH is required}
      KNOWLEDGE_API_EDGE_SEMANTIC_CANDIDATE_LIMIT: ${KNOWLEDGE_API_EDGE_SEMANTIC_CANDIDATE_LIMIT:?KNOWLEDGE_API_EDGE_SEMANTIC_CANDIDATE_LIMIT is required}
      KNOWLEDGE_API_LOG_LEVEL: ${KNOWLEDGE_API_LOG_LEVEL:?KNOWLEDGE_API_LOG_LEVEL is required}
      KNOWLEDGE_API_LOG_FILE_PATH: ${KNOWLEDGE_API_LOG_FILE_PATH:?KNOWLEDGE_API_LOG_FILE_PATH is required}
      KNOWLEDGE_API_LOG_FILE_MAX_BYTES: ${KNOWLEDGE_API_LOG_FILE_MAX_BYTES:?KNOWLEDGE_API_LOG_FILE_MAX_BYTES is required}
      KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT: ${KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT:?KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT is required}
    command: ["/app/bin/run-worker.sh"]
    networks:
      - backend
      - egress
    restart: unless-stopped

