# abstract: Base Docker Compose topology for MVP deployment with explicit migration gating.
# out_of_scope: Environment-specific overrides and host port exposure policies.
name: knowledge

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_admin_dev_change_me}
      APP_DB_USER: ${APP_DB_USER:-knowledge_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-knowledge_app_dev_change_me}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-knowledge_migration}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-knowledge_migration_dev_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    image: knowledge-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${MIGRATION_DB_USER:-knowledge_migration}:${MIGRATION_DB_PASSWORD:-knowledge_migration_dev_change_me}@postgres:5432/${POSTGRES_DB:-knowledge}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    image: knowledge-api:local
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-knowledge_app}:${APP_DB_PASSWORD:-knowledge_app_dev_change_me}@postgres:5432/${POSTGRES_DB:-knowledge}
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "main:app",
        "--app-dir",
        "src",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    expose:
      - "8000"
    networks:
      - backend
      - edge
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      target: prod
    image: knowledge-web:local
    depends_on:
      api:
        condition: service_started
    expose:
      - "4173"
    networks:
      - edge
    restart: unless-stopped

volumes:
  knowledge_postgres_data:
    name: knowledge_postgres_data

networks:
  backend:
    name: knowledge_backend
    internal: true
  edge:
    name: knowledge_edge
