# abstract: Base Docker Compose topology for MVP deployment with explicit migration gating.
# out_of_scope: Environment-specific overrides and host port exposure policies.
name: knowledge

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-postgres:dev
    environment:
      POSTGRES_DB: ${KNOWLEDGE_API_POSTGRES_DB:?KNOWLEDGE_API_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_API_POSTGRES_USER:?KNOWLEDGE_API_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_API_POSTGRES_PASSWORD:?KNOWLEDGE_API_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${KNOWLEDGE_API_DB_USER:?KNOWLEDGE_API_DB_USER is required}
      APP_DB_PASSWORD: ${KNOWLEDGE_API_DB_PASSWORD:?KNOWLEDGE_API_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${KNOWLEDGE_API_MIGRATION_DB_USER:?KNOWLEDGE_API_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${KNOWLEDGE_API_MIGRATION_DB_PASSWORD:?KNOWLEDGE_API_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  knowledge_corpus_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    image: knowledge-corpus-postgres:dev
    environment:
      POSTGRES_DB: ${KNOWLEDGE_CORPUS_POSTGRES_DB:?KNOWLEDGE_CORPUS_POSTGRES_DB is required}
      POSTGRES_USER: ${KNOWLEDGE_CORPUS_POSTGRES_USER:?KNOWLEDGE_CORPUS_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KNOWLEDGE_CORPUS_POSTGRES_PASSWORD:?KNOWLEDGE_CORPUS_POSTGRES_PASSWORD is required}
      APP_DB_USER: ${KNOWLEDGE_CORPUS_APP_DB_USER:?KNOWLEDGE_CORPUS_APP_DB_USER is required}
      APP_DB_PASSWORD: ${KNOWLEDGE_CORPUS_APP_DB_PASSWORD:?KNOWLEDGE_CORPUS_APP_DB_PASSWORD is required}
      MIGRATION_DB_USER: ${KNOWLEDGE_CORPUS_MIGRATION_DB_USER:?KNOWLEDGE_CORPUS_MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD:?KNOWLEDGE_CORPUS_MIGRATION_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_corpus_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_redis_data:/data
    networks:
      - backend
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    image: knowledge-api:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KNOWLEDGE_API_MIGRATION_DATABASE_URL: ${KNOWLEDGE_API_MIGRATION_DATABASE_URL:?KNOWLEDGE_API_MIGRATION_DATABASE_URL is required}
    command: ["alembic", "-c", "/app/apps/api/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  knowledge_corpus_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/knowledge_corpus/Dockerfile
    image: knowledge-corpus-migrate:dev
    depends_on:
      knowledge_corpus_db:
        condition: service_healthy
    environment:
      KNOWLEDGE_CORPUS_DATABASE_URL: ${KNOWLEDGE_CORPUS_DATABASE_URL:?KNOWLEDGE_CORPUS_DATABASE_URL is required}
      KNOWLEDGE_CORPUS_MIGRATION_DATABASE_URL: ${KNOWLEDGE_CORPUS_MIGRATION_DATABASE_URL:?KNOWLEDGE_CORPUS_MIGRATION_DATABASE_URL is required}
    command: ["alembic", "-c", "/app/apps/knowledge_corpus/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    image: knowledge-api:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      KNOWLEDGE_API_DATABASE_URL: ${KNOWLEDGE_API_DATABASE_URL:?KNOWLEDGE_API_DATABASE_URL is required}
      KNOWLEDGE_API_REDIS_URL: ${KNOWLEDGE_API_REDIS_URL:?KNOWLEDGE_API_REDIS_URL is required}
      KNOWLEDGE_API_EMBEDDING_API_URL: ${KNOWLEDGE_API_EMBEDDING_API_URL:?KNOWLEDGE_API_EMBEDDING_API_URL is required}
      KNOWLEDGE_API_EMBEDDING_MODEL: ${KNOWLEDGE_API_EMBEDDING_MODEL:?KNOWLEDGE_API_EMBEDDING_MODEL is required}
      KNOWLEDGE_API_EMBEDDING_API_KEY: ${KNOWLEDGE_API_EMBEDDING_API_KEY:?KNOWLEDGE_API_EMBEDDING_API_KEY is required}
      KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS:?KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS is required}
      KNOWLEDGE_API_SEARCH_MAX_MATCHED: ${KNOWLEDGE_API_SEARCH_MAX_MATCHED:?KNOWLEDGE_API_SEARCH_MAX_MATCHED is required}
      KNOWLEDGE_API_SEARCH_MAX_CONNECTED: ${KNOWLEDGE_API_SEARCH_MAX_CONNECTED:?KNOWLEDGE_API_SEARCH_MAX_CONNECTED is required}
      KNOWLEDGE_API_EDGE_SIMILARITY_TOP_K: ${KNOWLEDGE_API_EDGE_SIMILARITY_TOP_K:?KNOWLEDGE_API_EDGE_SIMILARITY_TOP_K is required}
      KNOWLEDGE_API_EDGE_SIMILARITY_MIN_STRENGTH: ${KNOWLEDGE_API_EDGE_SIMILARITY_MIN_STRENGTH:?KNOWLEDGE_API_EDGE_SIMILARITY_MIN_STRENGTH is required}
      KNOWLEDGE_API_LOG_LEVEL: ${KNOWLEDGE_API_LOG_LEVEL:-INFO}
      KNOWLEDGE_API_LOG_FILE_PATH: ${KNOWLEDGE_API_LOG_FILE_PATH:?KNOWLEDGE_API_LOG_FILE_PATH is required}
      KNOWLEDGE_API_LOG_FILE_MAX_BYTES: ${KNOWLEDGE_API_LOG_FILE_MAX_BYTES:-10485760}
      KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT: ${KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT:-5}
    command: ["/app/bin/run-api.sh"]
    expose:
      - "8000"
    networks:
      - backend
      - edge
    restart: unless-stopped

  worker:
    image: knowledge-api:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      KNOWLEDGE_API_DATABASE_URL: ${KNOWLEDGE_API_DATABASE_URL:?KNOWLEDGE_API_DATABASE_URL is required}
      KNOWLEDGE_API_REDIS_URL: ${KNOWLEDGE_API_REDIS_URL:?KNOWLEDGE_API_REDIS_URL is required}
      KNOWLEDGE_API_EMBEDDING_API_URL: ${KNOWLEDGE_API_EMBEDDING_API_URL:?KNOWLEDGE_API_EMBEDDING_API_URL is required}
      KNOWLEDGE_API_EMBEDDING_MODEL: ${KNOWLEDGE_API_EMBEDDING_MODEL:?KNOWLEDGE_API_EMBEDDING_MODEL is required}
      KNOWLEDGE_API_EMBEDDING_API_KEY: ${KNOWLEDGE_API_EMBEDDING_API_KEY:?KNOWLEDGE_API_EMBEDDING_API_KEY is required}
      KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS:?KNOWLEDGE_API_EMBEDDING_TIMEOUT_SECONDS is required}
      KNOWLEDGE_API_SEARCH_MAX_MATCHED: ${KNOWLEDGE_API_SEARCH_MAX_MATCHED:?KNOWLEDGE_API_SEARCH_MAX_MATCHED is required}
      KNOWLEDGE_API_SEARCH_MAX_CONNECTED: ${KNOWLEDGE_API_SEARCH_MAX_CONNECTED:?KNOWLEDGE_API_SEARCH_MAX_CONNECTED is required}
      KNOWLEDGE_API_EDGE_SIMILARITY_TOP_K: ${KNOWLEDGE_API_EDGE_SIMILARITY_TOP_K:?KNOWLEDGE_API_EDGE_SIMILARITY_TOP_K is required}
      KNOWLEDGE_API_EDGE_SIMILARITY_MIN_STRENGTH: ${KNOWLEDGE_API_EDGE_SIMILARITY_MIN_STRENGTH:?KNOWLEDGE_API_EDGE_SIMILARITY_MIN_STRENGTH is required}
      KNOWLEDGE_API_LOG_LEVEL: ${KNOWLEDGE_API_LOG_LEVEL:-INFO}
      KNOWLEDGE_API_LOG_FILE_PATH: ${KNOWLEDGE_API_LOG_FILE_PATH:?KNOWLEDGE_API_LOG_FILE_PATH is required}
      KNOWLEDGE_API_LOG_FILE_MAX_BYTES: ${KNOWLEDGE_API_LOG_FILE_MAX_BYTES:-10485760}
      KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT: ${KNOWLEDGE_API_LOG_FILE_BACKUP_COUNT:-5}
    command: ["/app/bin/run-worker.sh"]
    networks:
      - backend
      - edge
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      target: prod
    image: knowledge-web:dev
    depends_on:
      api:
        condition: service_started
    expose:
      - "4173"
    networks:
      - edge
    restart: unless-stopped

volumes:
  knowledge_postgres_data:
    name: knowledge_postgres_data
  knowledge_corpus_postgres_data:
    name: knowledge_corpus_postgres_data
  knowledge_redis_data:
    name: knowledge_redis_data

networks:
  backend:
    name: knowledge_backend
    internal: true
  edge:
    name: knowledge_edge
