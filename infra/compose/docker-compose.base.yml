# abstract: Base Docker Compose topology for MVP deployment with explicit migration gating.
# out_of_scope: Environment-specific overrides and host port exposure policies.

services:
  postgres:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  logto-postgres:
    image: postgres:18.3-bookworm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_logto_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  knowledge_corpus_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_corpus_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  source_pipeline_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - source_pipeline_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  mcp_db:
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$MIGRATION_DB_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_mcp_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "192mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - knowledge_redis_data:/data
    networks:
      - backend
    restart: unless-stopped

  logto-seed:
    image: svhd/logto:latest
    depends_on:
      logto-postgres:
        condition: service_healthy
    environment:
      ADMIN_PORT: "3002"
    entrypoint:
      [
        "sh",
        "-lc",
        "npm run cli db seed -- --db-url \"$$DB_URL\" --swe",
      ]
    networks:
      - backend
    restart: "no"

  logto:
    image: svhd/logto:latest
    depends_on:
      logto-postgres:
        condition: service_healthy
      logto-seed:
        condition: service_completed_successfully
    environment:
      ADMIN_PORT: "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/oidc/.well-known/openid-configuration', (response) => process.exit(response.statusCode && response.statusCode >= 200 && response.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend
      - edge
    restart: unless-stopped

  migrate:
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "/app/apps/api/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  knowledge_corpus_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/knowledge_corpus/Dockerfile
    depends_on:
      knowledge_corpus_db:
        condition: service_healthy
    command: ["alembic", "-c", "/app/apps/knowledge_corpus/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  source_pipeline_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/source_pipeline/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      source_pipeline_db:
        condition: service_healthy
    command: ["alembic", "-c", "/app/apps/source_pipeline/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  mcp_migrate:
    build:
      context: ../..
      dockerfile: infra/docker/mcp/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      mcp_db:
        condition: service_healthy
    command: ["alembic", "-c", "/app/apps/mcp/alembic.ini", "upgrade", "head"]
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/bin/run-api.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - backend
      - egress
    restart: unless-stopped

  mcp:
    build:
      context: ../..
      dockerfile: infra/docker/mcp/Dockerfile
      additional_contexts:
        job_queue_mcp_python_client: ../../../job-queue-mcp/packages/python-client
    depends_on:
      mcp_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      logto:
        condition: service_healthy
    command: ["/app/bin/run-mcp.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - backend
      - edge
    restart: unless-stopped

  worker:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/bin/run-worker.sh"]
    networks:
      - backend
      - egress
    restart: unless-stopped

  taxonomy_view_layout_runtime:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/bin/run-taxonomy-view-layout-runtime.sh"]
    networks:
      - backend
    restart: unless-stopped

  taxonomy_classification_runtime:
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/bin/run-taxonomy-classification-runtime.sh"]
    networks:
      - backend
    restart: unless-stopped

  taxonomy_classification_webhook_receiver:
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      logto:
        condition: service_healthy
    command: ["/app/bin/run-taxonomy-classification-webhook-receiver.sh"]
    networks:
      - backend
      - edge
    restart: unless-stopped

  orchestrator:
    depends_on:
      source_pipeline_db:
        condition: service_healthy
      source_pipeline_migrate:
        condition: service_completed_successfully
    command: ["/app/bin/run-orchestrator.sh"]
    networks:
      - backend
    restart: unless-stopped

  source_pipeline_webhook_receiver:
    depends_on:
      source_pipeline_db:
        condition: service_healthy
      source_pipeline_migrate:
        condition: service_completed_successfully
      logto:
        condition: service_healthy
    environment:
      SOURCE_PIPELINE_ROLE: webhook_receiver
    command: ["/app/bin/run-webhook-receiver.sh"]
    networks:
      - backend
      - edge
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      target: prod
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      logto:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5173/', (response) => process.exit(response.statusCode && response.statusCode >= 200 && response.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - backend
      - edge
    restart: unless-stopped

volumes:
  knowledge_postgres_data:
  knowledge_logto_postgres_data:
  knowledge_corpus_postgres_data:
  source_pipeline_postgres_data:
  knowledge_mcp_postgres_data:
  knowledge_redis_data:

networks:
  backend:
    internal: true
  egress:
  edge:
