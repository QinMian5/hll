# abstract: Production overrides for the Docker Compose base topology.
# out_of_scope: Multi-region traffic management and non-Docker deployment targets.
name: knowledge-prod

services:
  postgres:
    image: knowledge-postgres:prod
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 256

  logto-postgres:
    image: postgres:18.3-bookworm
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128

  knowledge_corpus_db:
    image: knowledge-corpus-postgres:prod
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.0
    pids_limit: 192

  source_pipeline_db:
    image: knowledge-source-pipeline-postgres:prod
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 192

  mcp_db:
    image: knowledge-mcp-postgres:prod
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128

  migrate:
    image: knowledge-api:prod

  knowledge_corpus_migrate:
    image: knowledge-corpus-migrate:prod

  source_pipeline_migrate:
    image: knowledge-source-pipeline:prod

  api:
    image: knowledge-api:prod
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256

  mcp:
    image: knowledge-mcp:prod
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 128

  worker:
    image: knowledge-api:prod
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2.0
    pids_limit: 512

  taxonomy_view_layout_runtime:
    image: knowledge-api:prod
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128

  taxonomy_classification_runtime:
    image: knowledge-api:prod
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    networks:
      - backend
      - egress

  taxonomy_classification_webhook_receiver:
    image: knowledge-api:prod
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    networks:
      - backend
      - edge

  redis:
    image: redis:7-bookworm
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

  logto:
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 128
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/knowledge-logto-extra-ca.crt
    volumes:
      - ${KNOWLEDGE_LOGTO_EXTRA_CA_CERT_PATH:?KNOWLEDGE_LOGTO_EXTRA_CA_CERT_PATH is required}:/etc/ssl/certs/knowledge-logto-extra-ca.crt:ro
    networks:
      - backend
      - edge

  orchestrator:
    image: knowledge-source-pipeline:prod
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    networks:
      - backend
      - egress

  source_pipeline_webhook_receiver:
    image: knowledge-source-pipeline:prod
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    networks:
      - backend
      - edge

  web:
    image: knowledge-web:prod
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 128
    environment:
      NODE_ENV: production

  nginx:
    image: knowledge-nginx:prod
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    build:
      context: ../..
      dockerfile: infra/docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      logto:
        condition: service_healthy
      mcp:
        condition: service_healthy
      web:
        condition: service_started
      source_pipeline_webhook_receiver:
        condition: service_started
      taxonomy_classification_webhook_receiver:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      edge: {}
      proxy:
        aliases:
          - knowledge-nginx
          - knowledge.orbitalis.org
          - knowledge-logto.orbitalis.org
          - admin.knowledge-logto.internal.home.arpa

volumes:
  knowledge_postgres_data:
    external: true
    name: knowledge_postgres_prod_data
  knowledge_logto_postgres_data:
    external: true
    name: knowledge_logto_postgres_prod_data
  knowledge_corpus_postgres_data:
    external: true
    name: knowledge_corpus_postgres_prod_data
  source_pipeline_postgres_data:
    external: true
    name: source_pipeline_postgres_prod_data
  knowledge_mcp_postgres_data:
    external: true
    name: knowledge_mcp_postgres_prod_data
  knowledge_redis_data:
    external: true
    name: knowledge_redis_prod_data

networks:
  proxy:
    external: true
    name: proxy
