# abstract: Production overrides for the Docker Compose base topology.
# out_of_scope: Multi-region traffic management and non-Docker deployment targets.
name: knowledge-prod

x-postgres-env-file: &postgres-env-file
  - path: ../env/generated/.env.prod.postgres.runtime
    required: false
    format: raw

x-logto-postgres-env-file: &logto-postgres-env-file
  - path: ../env/generated/.env.prod.logto-postgres.runtime
    required: false
    format: raw

x-knowledge-corpus-db-env-file: &knowledge-corpus-db-env-file
  - path: ../env/generated/.env.prod.knowledge-corpus-db.runtime
    required: false
    format: raw

x-source-pipeline-db-env-file: &source-pipeline-db-env-file
  - path: ../env/generated/.env.prod.source-pipeline-db.runtime
    required: false
    format: raw

x-mcp-db-env-file: &mcp-db-env-file
  - path: ../env/generated/.env.prod.mcp-db.runtime
    required: false
    format: raw

x-logto-env-file: &logto-env-file
  - path: ../env/generated/.env.prod.logto.runtime
    required: false
    format: raw

x-api-migrate-env-file: &api-migrate-env-file
  - path: ../env/generated/.env.prod.api-migrate.runtime
    required: false
    format: raw

x-knowledge-corpus-migrate-env-file: &knowledge-corpus-migrate-env-file
  - path: ../env/generated/.env.prod.knowledge-corpus-migrate.runtime
    required: false
    format: raw

x-source-pipeline-migrate-env-file: &source-pipeline-migrate-env-file
  - path: ../env/generated/.env.prod.source-pipeline-migrate.runtime
    required: false
    format: raw

x-mcp-migrate-env-file: &mcp-migrate-env-file
  - path: ../env/generated/.env.prod.mcp-migrate.runtime
    required: false
    format: raw

x-api-worker-env-file: &api-worker-env-file
  - path: ../env/generated/.env.prod.api-worker.runtime
    required: false
    format: raw

x-mcp-env-file: &mcp-env-file
  - path: ../env/generated/.env.prod.mcp.runtime
    required: false
    format: raw

x-taxonomy-view-layout-env-file: &taxonomy-view-layout-env-file
  - path: ../env/generated/.env.prod.taxonomy-view-layout.runtime
    required: false
    format: raw

x-taxonomy-classification-env-file: &taxonomy-classification-env-file
  - path: ../env/generated/.env.prod.taxonomy-classification.runtime
    required: false
    format: raw

x-taxonomy-classification-webhook-env-file: &taxonomy-classification-webhook-env-file
  - path: ../env/generated/.env.prod.taxonomy-classification-webhook.runtime
    required: false
    format: raw

x-source-pipeline-orchestrator-env-file: &source-pipeline-orchestrator-env-file
  - path: ../env/generated/.env.prod.source-pipeline-orchestrator.runtime
    required: false
    format: raw

x-source-pipeline-webhook-env-file: &source-pipeline-webhook-env-file
  - path: ../env/generated/.env.prod.source-pipeline-webhook.runtime
    required: false
    format: raw

x-web-env-file: &web-env-file
  - path: ../env/generated/.env.prod.web.runtime
    required: false
    format: raw

x-cloudflare-ingress-env-file: &cloudflare-ingress-env-file
  - path: ../env/generated/.env.prod.cloudflare-ingress.runtime
    required: false
    format: raw

services:
  postgres:
    image: knowledge-postgres:prod
    env_file: *postgres-env-file
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 256

  logto-postgres:
    image: postgres:18.3-bookworm
    env_file: *logto-postgres-env-file
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128

  knowledge_corpus_db:
    image: knowledge-corpus-postgres:prod
    env_file: *knowledge-corpus-db-env-file
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.0
    pids_limit: 192

  source_pipeline_db:
    image: knowledge-source-pipeline-postgres:prod
    env_file: *source-pipeline-db-env-file
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 192

  mcp_db:
    image: knowledge-mcp-postgres:prod
    env_file: *mcp-db-env-file
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128

  migrate:
    image: knowledge-api:prod
    env_file: *api-migrate-env-file

  knowledge_corpus_migrate:
    image: knowledge-corpus-migrate:prod
    env_file: *knowledge-corpus-migrate-env-file

  source_pipeline_migrate:
    image: knowledge-source-pipeline:prod
    env_file: *source-pipeline-migrate-env-file

  mcp_migrate:
    env_file: *mcp-migrate-env-file

  api:
    image: knowledge-api:prod
    env_file: *api-worker-env-file
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256

  mcp:
    image: knowledge-mcp:prod
    env_file: *mcp-env-file
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 128

  worker:
    image: knowledge-api:prod
    env_file: *api-worker-env-file
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2.0
    pids_limit: 512

  taxonomy_view_layout_runtime:
    image: knowledge-api:prod
    env_file: *taxonomy-view-layout-env-file
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128

  taxonomy_classification_runtime:
    image: knowledge-api:prod
    env_file: *taxonomy-classification-env-file
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    networks:
      - backend
      - egress

  taxonomy_classification_webhook_receiver:
    image: knowledge-api:prod
    env_file: *taxonomy-classification-webhook-env-file
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    networks:
      - backend
      - edge

  redis:
    image: redis:7-bookworm
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

  logto:
    env_file: *logto-env-file
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 128
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/knowledge-logto-extra-ca.crt
    volumes:
      - ../env/generated/.env.prod.logto-extra-ca.crt:/etc/ssl/certs/knowledge-logto-extra-ca.crt:ro
    networks:
      - backend
      - edge

  logto-seed:
    env_file: *logto-env-file

  orchestrator:
    image: knowledge-source-pipeline:prod
    env_file: *source-pipeline-orchestrator-env-file
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    networks:
      - backend
      - egress

  source_pipeline_webhook_receiver:
    image: knowledge-source-pipeline:prod
    env_file: *source-pipeline-webhook-env-file
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    networks:
      - backend
      - edge

  web:
    image: knowledge-web:prod
    env_file: *web-env-file
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 0.75
    pids_limit: 128
    environment:
      NODE_ENV: production

  nginx:
    image: knowledge-nginx:prod
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    build:
      context: ../..
      dockerfile: infra/docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      logto:
        condition: service_healthy
      mcp:
        condition: service_healthy
      web:
        condition: service_healthy
      source_pipeline_webhook_receiver:
        condition: service_started
      taxonomy_classification_webhook_receiver:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - edge

  cloudflare-ingress:
    image: cloudflare/cloudflared:latest
    env_file: *cloudflare-ingress-env-file
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - edge
      - egress
    restart: unless-stopped

volumes:
  knowledge_postgres_data:
    external: true
    name: knowledge_postgres_prod_data
  knowledge_logto_postgres_data:
    external: true
    name: knowledge_logto_postgres_prod_data
  knowledge_corpus_postgres_data:
    external: true
    name: knowledge_corpus_postgres_prod_data
  source_pipeline_postgres_data:
    external: true
    name: source_pipeline_postgres_prod_data
  knowledge_mcp_postgres_data:
    external: true
    name: knowledge_mcp_postgres_prod_data
  knowledge_redis_data:
    external: true
    name: knowledge_redis_prod_data
