# abstract: Edge reverse-proxy configuration for forwarding public web, webhook, and auth traffic.
# out_of_scope: TLS certificate configuration and advanced traffic shaping.
map $http_x_forwarded_proto $knowledge_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  listen 443;
  server_name _;

  location = /source-pipeline/webhooks/job-queue {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://source_pipeline_webhook_receiver:8080;
  }

  location = /taxonomy-classification/webhooks/job-queue {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://taxonomy_classification_webhook_receiver:8080;
  }

  location /web-api/ {
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://web:4173;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://web:4173/;
  }
}

server {
  listen 80;
  server_name knowledge-logto.orbitalis.org;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
