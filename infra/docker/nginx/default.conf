# abstract: Edge reverse-proxy configuration for forwarding public web, webhook, and auth traffic.
# out_of_scope: TLS certificate configuration and advanced traffic shaping.
map $http_x_forwarded_proto $knowledge_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

resolver 127.0.0.11 ipv6=off valid=30s;
resolver_timeout 5s;

server {
  listen 80;
  listen 443;
  server_name _;

  set $upstream_web web:5173;
  set $upstream_mcp mcp:8080;
  set $upstream_source_pipeline_webhook source_pipeline_webhook_receiver:8080;
  set $upstream_taxonomy_classification_webhook taxonomy_classification_webhook_receiver:8080;

  location = /source-pipeline/webhooks/job-queue {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://$upstream_source_pipeline_webhook;
  }

  location = /taxonomy-classification/webhooks/job-queue {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://$upstream_taxonomy_classification_webhook;
  }

  location /mcp {
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://$upstream_mcp;
  }

  location /web-api/ {
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://$upstream_web;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://$upstream_web;
  }
}

server {
  listen 80;
  server_name knowledge-logto.orbitalis.org;

  set $upstream_logto_auth logto:3001;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://$upstream_logto_auth;
  }
}

server {
  listen 80;
  server_name admin.knowledge-logto.internal.home.arpa;

  set $upstream_logto_admin logto:3002;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
    proxy_pass http://$upstream_logto_admin;
  }
}
